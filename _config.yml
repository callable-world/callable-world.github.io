# callable-world.github.io — конфигурация сайта.
# Собирается штатным Jekyll на стороне GitHub Pages: своего CI нет и не нужно.

title: Callable World
description: >-
  On agents, protocols and the physical world becoming callable.
lang: en

url: "https://callable-world.github.io"
baseurl: ""

theme: minima

# Подпись под статьями. Здесь и нигде больше не должно появляться
# личное имя или логин — см. CLAUDE.md, раздел «Личность».
#
# Строкой, а не вложенным `name:` — тема minima печатает site.author в подвал
# как есть, и из хеша получается видимый посетителю мусор вида
# {"name"=>"Callable World"}.
author: Callable World

# Показывать анонс статьи в списке на главной, а не одни заголовки.
show_excerpts: true

plugins:
  - jekyll-feed
  - jekyll-seo-tag

# Служебные файлы репозитория не должны попадать в собранный сайт.
# Без этого Jekyll копирует их в _site как есть, и они отдаются с сайта:
# publish.sh и tools/ реально висели на https://callable-world.github.io/publish.sh
exclude:
  - CLAUDE.md
  - ИНСТРУКЦИЯ.md
  - README.md
  - publish.sh
  - preview.sh
  - tools
  - Gemfile
  - Gemfile.lock
  - vendor

# Ссылки вида /2026/09/03/nazvanie-stati/
permalink: /:year/:month/:day/:title/
